<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasePilot — India's AI Legal Case Worker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0d14;
            --gold-accent: #c9a84c;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(201, 168, 76, 0.2);
        }
        body { background-color: var(--bg-deep); color: #ffffff; font-family: 'DM Sans', sans-serif; }
        .serif { font-family: 'Playfair Display', serif; }
        .gold-text { color: var(--gold-accent); }
        .gold-bg { background: linear-gradient(135deg, #c9a84c 0%, #8a6d2b 100%); }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); }
        
        /* New Doc Tab Styles */
        .doc-tab { padding: 10px 20px; border-bottom: 2px solid transparent; cursor: pointer; color: #888; transition: all 0.2s; }
        .doc-tab.active { border-color: var(--gold-accent); color: var(--gold-accent); }
        .doc-tab:hover { color: var(--gold-accent); }
        .doc-panel { display: none; }
        .doc-panel.active { display: block; }
        .doc-content-box { background: #050505; padding: 1rem; border-radius: 8px; max-height: 400px; overflow-y: auto; margin-bottom: 1rem; border: 1px solid #333; }
        .btn-download-gold { background: var(--gold-accent); color: black; padding: 10px 20px; border-radius: 8px; font-weight: bold; transition: opacity 0.2s; }
        .btn-download-gold:hover { opacity: 0.9; }
        .btn-copy-outline { border: 1px solid var(--gold-accent); color: var(--gold-accent); padding: 10px 20px; border-radius: 8px; transition: all 0.2s; }
        .btn-copy-outline:hover { background: rgba(201, 168, 76, 0.1); }
    </style>
</head>
<body>
    <div id="app-container" class="max-w-4xl mx-auto p-6">
        <!-- Input Form (omitted for brevity in this snippet) -->
        
        <!-- Results Section -->
        <div id="results" class="hidden space-y-8">
            <div id="documents-area"></div>
            <!-- Other result components -->
        </div>
    </div>

    <script>
        // --- NEW DOCUMENT LOGIC ---
        function formatTimeAgo(iso) {
            return "Just now"; // Simplified
        }

        function getDocIcon(docType) {
            const icons = {
                'legal_notice': '📋',
                'consumer_complaint': '⚖️',
                'rti_first_appeal': '📨',
                'rti_second_appeal': '📬',
                'police_complaint': '🚔',
                'affidavit': '✍️'
            };
            return icons[docType] || '📄';
        }

        function switchDocTab(index) {
            document.querySelectorAll('.doc-tab').forEach((t, i) => t.classList.toggle('active', i === index));
            document.querySelectorAll('.doc-panel').forEach((p, i) => p.classList.toggle('active', i === index));
        }

        function downloadDoc(index) {
            const doc = currentResults.documents_generated[index];
            const blob = new Blob([doc.content], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${doc.doc_type}_${currentResults.case_id}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyDoc(index) {
            const doc = currentResults.documents_generated[index];
            navigator.clipboard.writeText(doc.content).then(() => alert('Copied!'));
        }

        function downloadAllDocs() {
            const allContent = currentResults.documents_generated.map(doc => 
                `${'='.repeat(60)}\n${doc.doc_title.toUpperCase()}\n${'='.repeat(60)}\n\n${doc.content}`
            ).join('\n\n\n');
            const blob = new Blob([allContent], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `CasePilot_${currentResults.case_id}_All_Documents.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function renderDocuments(documents) {
            if (!documents || documents.length === 0) return '';
            
            const tabs = documents.map((doc, i) => `
                <button 
                    class="doc-tab ${i === 0 ? 'active' : ''}" 
                    onclick="switchDocTab(${i})"
                    id="tab-${i}">
                    ${getDocIcon(doc.doc_type)} ${doc.doc_title}
                </button>
            `).join('');
            
            const panels = documents.map((doc, i) => `
                <div class="doc-panel ${i === 0 ? 'active' : ''}" id="panel-${i}">
                    <div class="doc-meta flex gap-4 text-xs text-gray-500 mb-2">
                        <span class="doc-type-badge font-bold text-gold-accent">${doc.doc_type.toUpperCase()}</span>
                        <span class="doc-length">${doc.length} characters</span>
                    </div>
                    <div class="doc-content-box">
                        <pre class="text-sm text-gray-200 whitespace-pre-wrap">${doc.content}</pre>
                    </div>
                    <div class="doc-actions flex gap-4">
                        <button onclick="downloadDoc(${i})" class="btn-download-gold">
                            ↓ Download ${doc.doc_title} (.txt)
                        </button>
                        <button onclick="copyDoc(${i})" class="btn-copy-outline">
                            ⎘ Copy to Clipboard
                        </button>
                    </div>
                </div>
            `).join('');
            
            return `
                <div class="documents-card glass-card p-6 rounded-2xl">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="text-xl serif">GENERATED LEGAL DOCUMENTS</h3>
                            <p class="text-sm text-gray-400">${documents.length} document${documents.length > 1 ? 's' : ''} ready for use</p>
                        </div>
                        <button onclick="downloadAllDocs()" class="text-gold-accent underline text-sm hover:text-white">Download All</button>
                    </div>
                    <div class="doc-tabs flex border-b border-white border-opacity-10 mb-6 overflow-x-auto">${tabs}</div>
                    <div class="doc-panels">${panels}</div>
                </div>
            `;
        }

        // --- UPDATE IN showResults ---
        // document.getElementById('documents-area').innerHTML = renderDocuments(data.documents_generated);
    </script>
</body>
</html>
